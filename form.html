<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styleform.css">
    <title>Вступ 2025 - Форма зворотного звʼязку</title>

</head>
<body>

<div class="form-container">
    <table>
        <thead>
        <tr>
            <th> <img src="images/forma.jpg" style="width: 100%; height: auto;"> </th>
            <th class="credits-col">
                <h2>Вступ 2025</h2>
                <form action="#" method="POST" class="clearfix">

                    <div class="form-group">
                        <label for="fullname">Ваше ім'я та прізвище</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Іван Петренко" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Контактний телефон</label>
                        <input type="tel" id="phone" name="phone" placeholder="+380501234567" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Електронна пошта</label>
                        <input type="email" id="email" name="email" placeholder="ivan.petр@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="telegram">Телеграм</label>
                        <input type="text" id="telegram" name="telegram" placeholder="@ivan_p">
                    </div>

                    <div class="form-group">
                        <label for="nmt-math">Бали НМТ - Математика</label>
                        <input type="text" id="nmt-math" name="nmt_math" placeholder="185">
                    </div>

                    <div class="form-group">
                        <label for="nmt-ukr">Бали НМТ - Українська мова</label>
                        <input type="text" id="nmt-ukr" name="nmt_ukr" placeholder="190">
                    </div>

                    <div class="form-group">
                        <label for="nmt-hist">Бали НМТ - Історія України</label>
                        <input type="text" id="nmt-hist" name="nmt_hist" placeholder="178">
                    </div>

                    <div class="form-group">
                        <label for="nmt-fourth">Четвертий предмет з НМТ і бали за ним</label>
                        <input type="text" id="nmt-fourth" name="nmt_fourth" placeholder="Географія - 182">
                    </div>

                    <div class="form-group">
                        <label for="interests">Які напрями вам цікаві?</label>
                        <textarea id="interests" name="interests" placeholder="Мене цікавить інженерія програмного забезпечення та комп'ютерні науки."></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Submit</button>

            </th>
        </tr>
        </thead>
    </table>
    <a href="index2.html" style="color: blue; text-decoration: none; font-size: 14px; line-height: 38px; float: left; transition: color 0.3s;" onmouseover="this.style.color='#ffffff'" onmouseout="this.style.color='blue'">
        Таблиця з
        освітньою програмою спеціальності “Інжинирінг і програмування
        інфокомунікаційних систем” для першого курсу. </a>
    </form>
</div>

</body>
</html>
